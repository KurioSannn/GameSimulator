dataset_id: DATA-0003
name: "Render geometry LODs (kab/kota, provinsi, fragments) for the offline game map"
domain: geography
owner_institution: "Derived (NUSANTARA) from BIG SRC-0001 + registry DATA-0001"
source_url: "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/BATAS_KABKOTA_AR/MapServer/0"
access_method: json
primary: true
publication_date: "derived 2026-10-22 from BIG edisi Juni 2026"
retrieved_at: "2026-10-21/22 (raw)"
reference_period: "BIG edisi Juni 2026; Kemendagri 2025 codes"
update_frequency: "rebuild per snapshot"
geographic_resolution:
  level: "kabupaten/kota polygons; provinsi dissolved from them; 21 unallocated BIG fragments"
  coverage: "514 kab/kota, 38 provinsi, 21 fragments in every LOD"
variables:
  kabkota: [region_id, kode_bps, parent_region_id, province_kode_bps, region_level, name, nav_group_key, geometry]
  provinsi: [region_id, kode_bps, name, nav_group_key, geometry]
  fragments: [fragment_id, parent_region_id, remark, geometry]
units: {geometry: "WGS84 lon/lat degrees, RFC 7946 GeoJSON, 1e-6 deg precision"}
definitions:
  lod1: "Douglas-Peucker 1,000 m, national view (>= 2,000 km wide)"
  lod2: "Douglas-Peucker 100 m, island group / province view (300-2,000 km)"
  lod3: "Douglas-Peucker 40 m, kab/kota view (< 300 km)"
  nav_group_key: "presentation-only navigation group (D-016), not an administrative level"
license_notes: "Derived from BIG data; attribution to Badan Informasi Geospasial required (see SRC-0001)."
methodology_notes: "scripts/research/build_render_geometry.py (two-pass mapshaper 0.7.79, D-015). Selection: research/reports/lod_tolerance_selection.json."
known_limitations:
  - "Small islands near the interval size drawn shrunken (deformed parts median area ratio ~0.42); sub-pixel slivers at coarse zoom"
  - "Province outlines derived (no current official province polygons); cross-checked vs older province lines: median 7.5 m, 99.75 % within 50 m"
  - "Kab. Sumbawa from a 1e-7 deg recovery copy (D-018)"
  - "No area fields: game-facing area must be chosen deliberately (D-017)"
known_conflicts: []
transformation_pipeline:
  - "build_render_geometry.py --lod lod1 --interval 1000 / lod2 100 / lod3 40"
  - "validate_render_geometry.py, audit_island_components.py, compare_province_lines.py, render_previews.py, measure_load_times.py"
output_tables:
  - "data/processed/geography/SNAP-2026-10-21/render/lod1/{kabkota,provinsi,fragments}.json  (5.39 MB, 123,110 kab/kota vertices)"
  - "data/processed/geography/SNAP-2026-10-21/render/lod2/{kabkota,provinsi,fragments}.json  (15.18 MB, 398,555)"
  - "data/processed/geography/SNAP-2026-10-21/render/lod3/{kabkota,provinsi,fragments}.json  (28.34 MB, 752,109)"
validation_rules:
  - "15 hard checks per LOD (research/reports/render_geometry_validation.json): all pass"
  - "island component audit: 0 lost parts, 0 noticeable parts displaced (island_component_audit.json)"
  - "scripts/research/tests/test_render_geometry.py"
checksum: "file_sha256 per LOD in research/reports/render_geometry_validation.json"
status: active
